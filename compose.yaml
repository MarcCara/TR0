services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: quiz
      MYSQL_USER: quiz
      MYSQL_PASSWORD: quiz_local_password
      MYSQL_ROOT_PASSWORD: root_local_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_local_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data: